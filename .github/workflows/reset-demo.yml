name: Reset demo data

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  reset:
    name: Regenerate the demo account
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call the demo reset endpoint
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          DEMO_RESET_SECRET: ${{ secrets.DEMO_RESET_SECRET }}
        run: |
          if [ -z "$API_BASE_URL" ] || [ -z "$DEMO_RESET_SECRET" ]; then
            echo "::error::Set the API_BASE_URL and DEMO_RESET_SECRET repository secrets."
            exit 1
          fi

          status=$(curl -sS \
            --max-time 300 \
            --retry 3 \
            --retry-delay 15 \
            --retry-connrefused \
            -o response.json \
            -w "%{http_code}" \
            -X POST "${API_BASE_URL%/}/demo/reset" \
            -H "x-demo-secret: $DEMO_RESET_SECRET")

          echo "HTTP $status"
          cat response.json || true
          echo

          if [ "$status" != "200" ]; then
            echo "::error::Demo reset failed with HTTP $status"
            exit 1
          fi
